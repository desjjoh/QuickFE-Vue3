name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]
  merge_group:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: 'true'
  QUICKAPI_E2E_LIVE: '0'

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check

  linting:
    name: Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint

  type-checking:
    name: Type checking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Check application, unit tests, build configuration, and E2E types
        run: npm run type-check

  security-audit:
    name: Production security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run security:audit
      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-audit-${{ github.run_attempt }}
          path: |
            reports/production-audit.json
            reports/production-audit-result.json
          retention-days: 14
          if-no-files-found: warn

  unit-tests:
    name: Unit tests
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:ci
      - run: npm run test:unit:ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-results-${{ github.run_attempt }}
          path: |
            reports/unit-tests.xml
            reports/coverage-ratchet.json
            coverage/
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build-only
      - uses: actions/upload-artifact@v6
        with:
          name: browser-bundle-exposure-${{ github.run_attempt }}
          path: reports/browser-bundle-exposure.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: production-dist-${{ github.run_attempt }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  browser-tests:
    name: Browser tests (Chromium)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v7
        with:
          name: production-dist-${{ github.run_attempt }}
          path: dist/
      - name: Install headless Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium --only-shell
      - name: Test the built application, accessibility and keyboard contracts with API fixtures
        run: node node_modules/@playwright/test/cli.js test --project=chromium
      - name: Upload browser and accessibility reports, traces, and failure screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-results-${{ github.run_attempt }}
          path: |
            reports/browser-tests.xml
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  runtime-image:
    name: Runtime image exposure
    needs: [security-audit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate disposable certificates for the existing local TLS topology
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -keyout certs/localhost-key.pem -out certs/localhost.pem
      - name: Build an unpublished image with its own production security gate
        run: docker build --tag quickfe-vue3:ci .
      - name: Verify runtime contents and the image's own bundled assets
        run: npm run security:image -- quickfe-vue3:ci
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: runtime-image-exposure-${{ github.run_attempt }}
          path: |
            reports/runtime-image-exposure.json
            reports/runtime-browser-bundle-exposure.json
          retention-days: 14
          if-no-files-found: warn

  # Preserve the exact context already required by main's repository ruleset.
  check:
    name: Check
    if: always()
    needs:
      [
        formatting,
        linting,
        type-checking,
        security-audit,
        unit-tests,
        build,
        browser-tests,
        runtime-image,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Require every verification job to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/check-results.mjs
